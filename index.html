<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Cresswell Flipbook</title>

  <style>
    body {
      margin: 0;
      background: #222;
      overflow: hidden;
    }
    #flipbook {
      width: 100vw;
      height: 100vh;
    }

    /* Progress bar */
    #progress {
      position: fixed;
      bottom: 0;
      left: 0;
      height: 6px;
      background: #4caf50;
      width: 0%;
      transition: width 0.3s ease;
    }
  </style>
</head>

<body>
  <div id="flipbook"></div>
  <div id="progress"></div>

  <!-- StPageFlip -->
  <script src="pageflip/page-flip.browser.js"></script>

  <script>
    // Number of pages in your flipbook
    const totalPages = 34;

    // Build an array of image paths: ["images/1.jpg", "images/2.jpg", ...]
    const pages = [];
    for (let i = 1; i <= totalPages; i++) {
      pages.push(`images/${i}.jpg`);
    }

    // Create the flipbook
    const flipbook = new St.PageFlip(document.getElementById('flipbook'), {
      width: 800,
      height: 1000,
      size: 'stretch',
      showCover: false,
      maxShadowOpacity: 0.5,
      usePortrait: false,
      mobileScrollSupport: false
    });

    // Load images directly
    flipbook.loadFromImages(pages);
