<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Cresswell Flipbook</title>

  <style>
    body {
      margin: 0;
      background: #000;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
    }

    #flipbook {
      width: 100vw;
      height: 100vh;
      background: #000;
    }

    .stf__wrapper {
      background: #000 !important;
    }

    /* Progress bar */
    #progress {
      position: fixed;
      bottom: 0;
      left: 0;
      height: 6px;
      background: #4caf50;
      width: 0%;
      transition: width 0.3s ease;
      z-index: 9999;
    }

    /* Zoom button */
    #zoomBtn {
      position: fixed;
      bottom: 20px;
      left: 20px;
      font-size: 20px;
      cursor: pointer;
      z-index: 999999;
      color: white;
      padding: 10px 16px;
      background: rgba(0,0,0,0.6);
      border-radius: 8px;
      font-family: sans-serif;
    }

    #zoomBtn:hover {
      background: rgba(255,255,255,0.2);
    }

    /* Restart button */
    #homeBtn {
      position: fixed;
      bottom: 20px;
      right: 20px;
      font-size: 20px;
      cursor: pointer;
      z-index: 999999;
      color: white;
      padding: 10px 16px;
      background: rgba(0,0,0,0.6);
      border-radius: 8px;
      font-family: sans-serif;
    }

    #homeBtn:hover {
      background: rgba(255,255,255,0.2);
    }

    /* Page numbers (centered) */
    #pageNumber {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      color: white;
      font-size: 18px;
      font-family: sans-serif;
      z-index: 999999 !important;
      background: rgba(0,0,0,0.5);
      padding: 6px 12px;
      border-radius: 6px;
    }

    /* Tap zones for page turning */
    #tapLeft, #tapRight {
      position: fixed;
      top: 0;
      width: 25vw;
      height: 100vh;
      z-index: 5000;
    }

    #tapLeft { left: 0; }
    #tapRight { right: 0; }

    /* Zoom modal */
    #zoomModal {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0,0,0,1);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 20000;
    }

    #zoomModal img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      touch-action: pinch-zoom;
    }
  </style>
</head>

<body>
  <div id="flipbook"></div>

  <div id="progress"></div>
  <div id="zoomBtn">Zoom</div>
  <div id="homeBtn">Restart</div>
  <div id="pageNumber">Page 1 / 34</div>

  <div id="tapLeft"></div>
  <div id="tapRight"></div>

  <div id="zoomModal">
    <img id="zoomImage" src="">
  </div>

  <script src="pageflip/page-flip.browser.js"></script>

  <script>
    const totalPages = 34;

    // Build image list
    const pages = [];
    for (let i = 1; i <= totalPages; i++) {
      pages.push(`images/${i}.jpg`);
    }

    // Create flipbook
    const flipbook = new St.PageFlip(document.getElementById('flipbook'), {
      width: 800,
      height: 1000,
      size: 'stretch',
      showCover: false,
      maxShadowOpacity: 0.5,
      usePortrait: false,
      mobileScrollSupport: false
    });

    flipbook.loadFromImages(pages);

    // Update progress + page number
    flipbook.on("flip", (e) => {
      const current = e.data; // zero-based
      const percent = (current / (pages.length - 1)) * 100;
      document.getElementById("progress").style.width = percent + "%";
      document.getElementById("pageNumber").innerText =
        `Page ${current + 1} / ${totalPages}`;
    });

    // Restart button
    document.getElementById("homeBtn").onclick = () => {
      flipbook.flip(0);
      document.getElementById("progress").style.width = "0%";
      document.getElementById("pageNumber").innerText = "Page 1 / 34";
    };

    // Page turn tap zones
    document.getElementById("tapLeft").onclick = () => flipbook.flipPrev();
    document.getElementById("tapRight").onclick = () => flipbook.flipNext();

    // Zoom modal (button only)
    const zoomModal = document.getElementById("zoomModal");
    const zoomImage = document.getElementById("zoomImage");

    document.getElementById("zoomBtn").onclick = () => {
      const current = flipbook.getCurrentPageIndex();
      zoomImage.src = pages[current];
      zoomModal.style.display = "flex";
    };

    zoomModal.onclick = () => {
      zoomModal.style.display = "none";
    };
  </script>
</body>
</html>
