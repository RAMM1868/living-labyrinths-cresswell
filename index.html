<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Cresswell Flipbook</title>

  <style>
    body {
      margin: 0;
      background: #222;
      overflow: hidden;
    }
    #flipbook {
      width: 100vw;
      height: 100vh;
    }
  </style>
</head>

<body>
  <div id="flipbook"></div>

  <!-- StPageFlip -->
  <script src="pageflip/page-flip.browser.js"></script>

  <!-- PDF.js (ES module) -->
  <script type="module">
    import * as pdfjsLib from './pdfjs/pdf.mjs';

    pdfjsLib.GlobalWorkerOptions.workerSrc = './pdfjs/pdf.worker.mjs';

    async function loadPDF() {
      const pdf = await pdfjsLib.getDocument('./Cresswell flipbook.pdf').promise;
      const pages = [];

      for (let i = 1; i <= pdf.numPages; i++) {
        const page = await pdf.getPage(i);
        const viewport = page.getViewport({ scale: 2 });
        const canvas = document.createElement('canvas');
        const context = canvas.getContext('2d');

        canvas.width = viewport.width;
        canvas.height = viewport.height;

        await page.render({ canvasContext: context, viewport }).promise;

        pages.push(canvas.toDataURL());
      }

      const flipbook = new St.PageFlip(document.getElementById('flipbook'), {
        width: 800,
        height: 1000,
        size: 'stretch',
        showCover: false,
        maxShadowOpacity: 0.5,
      });

      flipbook.loadFromImages(pages);
    }

    loadPDF();
  </script>
</body>
</html>
